# Settings of the foundry-tts command (src/foundry_tts). Values that depend on the Azure
# environment (resource ID, region, endpoint, deployment) come from environment variables or
# .env instead: see .env.example. Command-line options override the values below.

[defaults]
# Profile used when --profile isn't given.
profile = "ava-hd"

[speech]
# Language of the SSML when a profile doesn't set one.
language = "en-US"
# An MP3 (audio-*-mp3) or WAV (riff-*) format of the Speech REST API.
output_format = "audio-24khz-160kbitrate-mono-mp3"
# Pause between paragraphs of the text (<break>). MAI-Voice voices ignore <break>, so they get
# none.
paragraph_break_ms = 400
# Regional text to speech endpoint; {region} is replaced by FOUNDRY_REGION.
endpoint_template = "https://{region}.tts.speech.microsoft.com/cognitiveservices/v1"
# Longest text sent in one request, in characters. Azure Speech makes at most 10 minutes of
# audio per request and cuts the rest silently; narration runs about 1,000 characters a minute,
# so 6,000 keeps each request near 6 minutes. Longer text is split between paragraphs (or
# sentences) and the MP3 parts are joined.
max_chars_per_request = 6000

[openai]
# mp3, wav, flac, opus or aac.
response_format = "mp3"
# Longest input the /audio/speech API accepts, in characters. Longer text is split, as for
# speech.
max_input_chars = 4096

[deck]
# foundry-tts deck: a "(Click)" cue in the speaker notes becomes a pause of this length.
cue_pause_ms = 500
# foundry-tts deck narrate: the name of the audio shape it inserts (a rerun replaces shapes with
# this name or its tag), and how far right of the slide it goes, in points, so it never covers
# the slide's content. The shape is also hidden during the show.
audio_shape_name = "foundry-tts narration"
off_slide_margin_points = 20
# deck narrate --auto-advance (and --video): a narrated slide moves on this long after its audio
# ends; a slide without narration shows this long.
advance_gap_seconds = 1
silent_slide_seconds = 5

[video]
# deck narrate --video: PowerPoint's MP4 export (Presentation.CreateVideo). Height in pixels
# (720, 1080, 2160), frames per second, quality 1 to 100; how long to wait for it, and how often to
# check, in seconds.
vertical_resolution = 1080
frames_per_second = 30
quality = 85
timeout_seconds = 3600
poll_seconds = 5

[http]
timeout_seconds = 120
user_agent = "foundry-tts"

[output]
# Where audio goes when --out isn't given (relative to the current folder).
folder = "output"

# ---- Voice profiles: pick one with --profile <name>, or several to compare them ----
# engine = "speech" (Azure Speech voices) or "openai" (the gpt-4o-mini-tts deployment).
# Speech settings: voice, language, style (<mstts:express-as>), rate and pitch (<prosody>, e.g.
# "-5%", "+2st"), temperature (0 to 1, HD voices only: lower is steadier).
# openai settings: voice (alloy, ash, ballad, coral, echo, sage, shimmer, verse, marin, cedar) and
# instructions (plain-English direction of tone and pace).
# Try voices first in the Foundry playground: see docs/tts-tuning.md.

[profiles.ava-hd]
engine = "speech"
voice = "en-US-Ava:DragonHDLatestNeural"

[profiles.ava-hd-steady]
engine = "speech"
voice = "en-US-Ava:DragonHDLatestNeural"
temperature = 0.6
rate = "-5%"

[profiles.harper-narrator]
engine = "speech"
voice = "en-US-Harper:MAI-Voice-2.1"
style = "narrator"

[profiles.marin-presenter]
engine = "openai"
voice = "marin"
instructions = "Calm, confident conference presenter. Clear diction, a natural pace, and a brief pause after each sentence."

# ---- Pronunciation: how to say a word or acronym, for every profile ----
# Whole words, case-sensitive. Speech voices get <sub alias="…">; the openai engine gets the
# replacement text. A deck-specific list can be added with --lexicon <file> (a [lexicon] table).
[lexicon]
AKS = "A K S"
SaaS = "sass"
